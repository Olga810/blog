<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Мой блог{% endblock %}</title>
</head>
<body>
    <header>
        <nav>
            <a href="{% url 'blog:post_list' %}">Все посты</a> |
            <a href="/admin/">Админка</a>
        </nav>
        <hr>
    </header>

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <footer>
        <hr>
        <p>&copy; {% now "Y" %} Мой блог на Django</p>
    </footer>
</body>
</html>
